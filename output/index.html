<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阻抗匹配 · 微软云希男声版</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#edf4fc;font-family:system-ui,"PingFang SC",sans-serif}main{max-width:1100px;margin:24px auto;padding:0 24px}small{color:#63dfef;letter-spacing:.12em}h1{font-size:clamp(24px,4vw,36px);margin:10px 0}p{color:#a5b6cc;line-height:1.7;margin:8px 0}.player{position:relative;margin:20px 0;border:1px solid #253950;border-radius:14px;overflow:hidden;background:#080e18}video{display:block;width:100%;max-height:72vh;background:#080e18}.start{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:#102b3eee;color:#f1fbff;border:1px solid #63dfef;font-size:22px;padding:16px 28px;border-radius:12px;cursor:pointer}.start[hidden]{display:none}nav{display:flex;gap:12px;flex-wrap:wrap}a,button{font:inherit;color:#cce9f5;text-decoration:none;background:#16263a;border:1px solid #2c435b;border-radius:9px;padding:10px 15px;cursor:pointer}a:hover,button:hover{border-color:#63dfef;color:#63dfef}.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px;margin:24px 0}.chapters button{text-align:left;font-size:14px;line-height:1.6}.time{color:#63dfef;font-variant-numeric:tabular-nums;margin-right:10px}footer{color:#71859f;font-size:13px;line-height:1.8;padding:12px 0 30px}h2{font-size:20px;margin:28px 0 8px}#message{color:#ffa571}#diagnostics{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}

<main><small>电路直觉 / 微软云希男声版</small><h1>阻抗匹配</h1><p>从一束电压波出发，分清少反射、最大功率与保住电压。</p>
<div class="player"><video id="film" controls preload="auto" poster="poster.jpg" playsinline><source src="impedance-matching.mp4?revision=playback-fix-1" type="video/mp4"></video><button id="start" class="start" type="button">▶ 播放视频</button></div>
<p id="message" role="status" hidden></p>
<nav><a href="impedance-matching.mp4?revision=playback-fix-1" download="阻抗匹配-微软云希男声.mp4">下载 MP4</a><a href="impedance-matching.zh-CN.srt" download>下载字幕</a><a href="contact-sheet.png" target="_blank">查看分镜</a></nav>
<pre id="diagnostics" hidden></pre>
<h2>章节</h2><div id="chapters" class="chapters"></div>
<footer>微软云希男声 · 中文字幕 · 720p / 30 fps<br>技术参考：Analog Devices · Keysight · Texas Instruments。</footer></main>
<script>
const video=document.getElementById('film'),start=document.getElementById('start'),message=document.getElementById('message'),diagnostics=document.getElementById('diagnostics');
const debug=new URLSearchParams(location.search).has('diagnostic');const events=[];diagnostics.hidden=!debug;
function state(event){if(!debug)return;const buffered=[];for(let i=0;i<video.buffered.length;i++)buffered.push([video.buffered.start(i),video.buffered.end(i)]);events.push({event,wall:Date.now(),time:video.currentTime,paused:video.paused,ready:video.readyState,network:video.networkState,buffered,error:video.error?{code:video.error.code,message:video.error.message}:null});if(events.length>30)events.shift();diagnostics.textContent=JSON.stringify(events,null,2);}
async function play(){message.hidden=true;try{await video.play()}catch(e){state(e.name+': '+e.message);if(e.name!=='AbortError'){message.textContent='播放未能启动，请再次点击播放，或下载 MP4 后打开。';message.hidden=false;}}}
start.onclick=play;
for(const name of ['loadstart','loadedmetadata','loadeddata','play','playing','pause','waiting','stalled','suspend','error','seeking','seeked','ended'])video.addEventListener(name,()=>{state(name);start.hidden=!video.paused;});
let last=0;video.addEventListener('timeupdate',()=>{if(Math.abs(video.currentTime-last)>1){state('timeupdate');last=video.currentTime;}});
video.addEventListener('error',()=>{message.textContent='视频读取失败，可以下载 MP4 后本地播放。';message.hidden=false;});
fetch('chapters.json').then(r=>r.json()).then(list=>{for(const c of list){const b=document.createElement('button');const t=document.createElement('span');t.className='time';t.textContent=c.time;b.append(t,document.createTextNode(c.title));b.onclick=()=>{video.currentTime=c.start;play();video.scrollIntoView({behavior:'smooth',block:'center'})};document.getElementById('chapters').append(b)}})
</script></html>
